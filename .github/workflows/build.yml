name: Build APK
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Unzip project
        run: |
          unzip -o *.zip
          # Ищем, где лежит gradlew, и перемещаем всё содержимое этой папки в корень
          GRADLE_DIR=$(find . -name gradlew -exec dirname {} \;)
          if [ "$GRADLE_DIR" != "." ] && [ ! -z "$GRADLE_DIR" ]; then
            echo "Проект найден в папке: $GRADLE_DIR"
            mv $GRADLE_DIR/* . 2>/dev/null || true
            mv $GRADLE_DIR/.* . 2>/dev/null || true
          fi
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          
