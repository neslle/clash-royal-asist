name: Build APK
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Unzip project
        run: unzip -o *.zip
      - name: Build App
        run: |
          # Ищем папку, в которой реально лежит gradlew после распаковки
          GRADLE_PATH=$(find . -name gradlew)
          GRADLE_DIR=$(dirname "$GRADLE_PATH")
          echo "Проект обнаружен в директории: $GRADLE_DIR"
          cd "$GRADLE_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
          
