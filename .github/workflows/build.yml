name: Build APK
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Unzip project
        run: |
          unzip -o *.zip
          echo "=== СПИСОК РАСПАКОВАННЫХ ФАЙЛОВ ==="
          ls -la
      - name: Build App
        run: |
          # Находим точный путь к файлу gradlew
          GRADLE_PATH=$(find . -name "gradlew" -type f | head -n 1)
          if [ -z "$GRADLE_PATH" ]; then
            echo "КРИТИЧЕСКАЯ ОШИБКА: Файл gradlew не найден ни в одной папке архива!"
            exit 1
          fi
          GRADLE_DIR=$(dirname "$GRADLE_PATH")
          echo "Проект обнаружен в директории: $GRADLE_DIR"
          cd "$GRADLE_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
          
